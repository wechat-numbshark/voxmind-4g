<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>演示环境 · VoxMind 4G 控制台</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="wrap top">
    <a class="mark" id="home" href="../">返回介绍</a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
  </header>

  <main class="wrap demo-wrap">
    <p class="banner" role="status">
      <strong id="banner">演示环境</strong>
      <span id="note">可点击体验完整 4G 语音行动控制台。数据纯合成，可随时重置，不连接真实设备，也不会写入飞书。</span>
    </p>

    <section class="device-bar panel" aria-label="Simulated device status">
      <div class="device-meta">
        <span class="dot" aria-hidden="true"></span>
        <strong id="device">虚构设备 · demo-voxmind-not-a-real-device · 合成</strong>
      </div>
      <div class="device-telemetry">
        <span id="tel-net">4G LTE · 模拟在线</span>
        <span id="tel-bat">电量 88%</span>
        <span id="tel-fw">固件 v1.0.27</span>
      </div>
    </section>

    <section class="scenarios" aria-label="Demo scenarios">
      <p class="sc-label" id="sc-label">选择体验场景：</p>
      <div class="sc-tabs" role="tablist">
        <button type="button" class="sc-tab" data-scenario="feishu" aria-selected="true" id="tab-feishu">飞书任务</button>
        <button type="button" class="sc-tab" data-scenario="expense" aria-selected="false" id="tab-expense">自动记账</button>
        <button type="button" class="sc-tab" data-scenario="smarthome" aria-selected="false" id="tab-smarthome">智能家居</button>
      </div>
    </section>

    <div class="demo-actions">
      <button type="button" id="show" class="primary">1. 模拟 4G 语音上传</button>
      <button type="button" id="propose" disabled>2. 生成待确认卡片</button>
      <button type="button" id="confirm" disabled>3. 设备 / 网页确认执行</button>
      <button type="button" id="reset">恢复演示数据</button>
    </div>

    <div class="console-grid">
      <aside class="device-screen" aria-label="Device screen preview">
        <div class="screen-top">
          <span>19:20</span>
          <span>4G · 88%</span>
        </div>
        <div class="screen-body">
          <p class="screen-status" id="screen-status">待机中 · 按键说话</p>
          <p class="screen-card-title" id="screen-title"></p>
          <p class="screen-card-sub" id="screen-sub"></p>
        </div>
        <div class="screen-keys" aria-hidden="true">
          <span>OK</span><span>REC</span><span>BACK</span>
        </div>
      </aside>

      <div class="stage">
        <article class="card panel" id="speech" hidden>
          <h2><span class="heading"></span><span class="badge">合成</span></h2>
          <p class="quote-text"></p>
        </article>
        <article class="card panel" id="proposal" hidden>
          <h2><span class="heading"></span><span class="badge">合成</span></h2>
          <p class="title"></p>
          <p class="when"></p>
          <p class="who"></p>
          <p class="channel"></p>
        </article>
        <article class="card panel executed" id="record" hidden>
          <h2><span class="heading"></span><span class="badge ok">合成</span></h2>
          <p class="title"></p>
          <p class="state"></p>
          <p class="quote"></p>
          <p class="feishu"></p>
        </article>
      </div>
    </div>
  </main>

  <script type="module" src="demo.js"></script>
</body>
</html>
