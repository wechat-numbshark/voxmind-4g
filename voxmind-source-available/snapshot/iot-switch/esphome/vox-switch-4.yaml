substitutions:
  device_name: vox-switch-04
  friendly_name: Vox Switch 04

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Four-channel low-voltage control-box template for EVA and VoxMind"

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

switch:
  - platform: gpio
    id: output_1
    name: "Output 1"
    pin: { number: GPIO3, inverted: true }
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: output_2
    name: "Output 2"
    pin: { number: GPIO4, inverted: true }
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: output_3
    name: "Output 3"
    pin: { number: GPIO5, inverted: true }
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: output_4
    name: "Output 4"
    pin: { number: GPIO6, inverted: true }
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    name: "Button 1"
    pin: { number: GPIO0, mode: { input: true, pullup: true }, inverted: true }
    filters: [ { delayed_on: 30ms }, { delayed_off: 30ms } ]
    on_press: [ { switch.toggle: output_1 } ]
  - platform: gpio
    name: "Button 2"
    pin: { number: GPIO1, mode: { input: true, pullup: true }, inverted: true }
    filters: [ { delayed_on: 30ms }, { delayed_off: 30ms } ]
    on_press: [ { switch.toggle: output_2 } ]
  - platform: gpio
    name: "Button 3"
    pin: { number: GPIO7, mode: { input: true, pullup: true }, inverted: true }
    filters: [ { delayed_on: 30ms }, { delayed_off: 30ms } ]
    on_press: [ { switch.toggle: output_3 } ]
  - platform: gpio
    name: "Button 4"
    pin: { number: GPIO10, mode: { input: true, pullup: true }, inverted: true }
    filters: [ { delayed_on: 30ms }, { delayed_off: 30ms } ]
    on_press: [ { switch.toggle: output_4 } ]

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
